name: Verify account foundation
on:
  push:
    branches: [codex/account-foundation, codex/marketplace-orders, codex/logistics-receipt, codex/erp-release]
    paths:
      - 'server/**'
      - 'native-android/**'
      - 'db/**'
      - 'drizzle/**'
      - 'scripts/**'
      - 'tests/**'
      - 'dist/operations*'
      - 'package*.json'
      - '.github/workflows/account-foundation.yml'
  pull_request:
    paths:
      - 'server/accounts/**'
      - 'native-android/**'
      - 'drizzle/**'
      - 'tests/account-foundation.test.mjs'
      - '.github/workflows/account-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test && npm run check && npm run build
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Compile native account screens and tests
        working-directory: native-android
        run: bash ./gradlew assembleDebug assembleDebugAndroidTest -PaccountFoundation=true --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native sign-in, private drafts and retry recovery on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            cd native-android && bash ./gradlew connectedDebugAndroidTest -PaccountFoundation=true -Pandroid.testInstrumentationRunnerArguments.class=com.ewaste.nativeapp.AccountFoundationTest,com.ewaste.nativeapp.MarketplaceTest,com.ewaste.nativeapp.LogisticsTest --no-daemon
            timeout 20s adb pull /sdcard/account-draft.png native-android/native-account-draft.png
            timeout 20s adb pull /sdcard/market-order.png native-android/native-market-order.png
            timeout 20s adb pull /sdcard/logistics.png native-android/native-logistics.png
      - name: Capture emulator details on failure
        if: failure()
        run: timeout 20s adb logcat -d -s AndroidRuntime > native-android/account-crash.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-foundation-test-results
          path: |
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
            native-android/app/build/outputs/connected_android_test_additional_output/
            native-android/account-crash.log
            native-android/native-account-draft.png
            native-android/native-market-order.png
            native-android/native-logistics.png
          retention-days: 7
