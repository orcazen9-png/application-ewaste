name: Verify account foundation
on:
  push:
    branches: [codex/account-foundation, codex/marketplace-orders, codex/logistics-receipt, codex/erp-release]
    paths:
      - 'server/**'
      - 'native-android/**'
      - 'db/**'
      - 'drizzle/**'
      - 'scripts/**'
      - 'tests/**'
      - 'dist/operations*'
      - 'package*.json'
      - '.github/workflows/account-foundation.yml'
  pull_request:
    paths:
      - 'server/accounts/**'
      - 'native-android/**'
      - 'drizzle/**'
      - 'tests/account-foundation.test.mjs'
      - '.github/workflows/account-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test && npm run check && npm run build
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Compile native account screens and tests
        working-directory: native-android
        run: bash ./gradlew assembleDebug assembleDebugAndroidTest -PaccountFoundation=true --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native sign-in, private drafts and retry recovery on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            cd native-android && bash ./gradlew connectedDebugAndroidTest -PaccountFoundation=true -Pandroid.testInstrumentationRunnerArguments.class=com.ewaste.nativeapp.AccountFoundationTest,com.ewaste.nativeapp.MarketplaceTest,com.ewaste.nativeapp.LogisticsTest,com.ewaste.nativeapp.FinanceTest,com.ewaste.nativeapp.NativeDesignTest,com.ewaste.nativeapp.AccountEntryTest,com.ewaste.nativeapp.FacilityTest,com.ewaste.nativeapp.DiscoveryTest,com.ewaste.nativeapp.ChatDeletionTest --no-daemon
            timeout 20s adb pull /sdcard/account-draft.png native-android/native-account-draft.png
            timeout 20s adb pull /sdcard/market-order.png native-android/native-market-order.png
            timeout 20s adb pull /sdcard/logistics.png native-android/native-logistics.png
            timeout 20s adb pull /sdcard/ui-home.png native-android/ui-home.png
            timeout 20s adb pull /sdcard/ui-photos.png native-android/ui-photos.png
            timeout 20s adb pull /sdcard/ui-details.png native-android/ui-details.png
            timeout 20s adb pull /sdcard/ui-earnings.png native-android/ui-earnings.png
            timeout 20s adb pull /sdcard/ui-welcome.png native-android/ui-welcome.png
            timeout 20s adb pull /sdcard/ui-roles.png native-android/ui-roles.png
            timeout 20s adb pull /sdcard/ui-signup.png native-android/ui-signup.png
            timeout 20s adb pull /sdcard/ui-login.png native-android/ui-login.png
            timeout 20s adb pull /sdcard/ui-recycler-home.png native-android/ui-recycler-home.png
            timeout 20s adb pull /sdcard/ui-facility-business.png native-android/ui-facility-business.png
            timeout 20s adb pull /sdcard/ui-facility-services.png native-android/ui-facility-services.png
            timeout 20s adb pull /sdcard/ui-facility-documents.png native-android/ui-facility-documents.png
            timeout 20s adb pull /sdcard/ui-facility-pending.png native-android/ui-facility-pending.png
            timeout 20s adb pull /sdcard/ui-suggested-materials.png native-android/ui-suggested-materials.png
            timeout 20s adb pull /sdcard/ui-directory.png native-android/ui-directory.png
            timeout 20s adb pull /sdcard/ui-posted-lots.png native-android/ui-posted-lots.png
            timeout 20s adb pull /sdcard/ui-asking-price.png native-android/ui-asking-price.png
            timeout 20s adb pull /sdcard/ui-conversation.png native-android/ui-conversation.png
            timeout 20s adb pull /sdcard/ui-deleted-lots.png native-android/ui-deleted-lots.png
            timeout 20s adb pull /sdcard/ui-lot-delete-button.png native-android/ui-lot-delete-button.png
            adb shell wm size 1080x1920
            adb shell wm density 480
            adb shell settings put system font_scale 1.3
            adb install -r native-android/app/build/outputs/apk/debug/app-debug.apk
            adb install -r -t native-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.ewaste.nativeapp.NativeDesignTest,com.ewaste.nativeapp.FacilityTest,com.ewaste.nativeapp.DiscoveryTest,com.ewaste.nativeapp.ChatDeletionTest -e screenshotPrefix compact com.ewaste.marketplace.collector.test/androidx.test.runner.AndroidJUnitRunner | tee native-android/compact-ui-test.txt
            grep -q 'OK (6 tests)' native-android/compact-ui-test.txt
            timeout 20s adb pull /sdcard/compact-photos.png native-android/compact-photos.png
            timeout 20s adb pull /sdcard/compact-earnings.png native-android/compact-earnings.png
            timeout 20s adb pull /sdcard/compact-facility-business.png native-android/compact-facility-business.png
            timeout 20s adb pull /sdcard/compact-facility-documents.png native-android/compact-facility-documents.png
            timeout 20s adb pull /sdcard/compact-suggested-materials.png native-android/compact-suggested-materials.png
            timeout 20s adb pull /sdcard/compact-directory.png native-android/compact-directory.png
            timeout 20s adb pull /sdcard/compact-conversation.png native-android/compact-conversation.png
            timeout 20s adb pull /sdcard/compact-lot-delete-button.png native-android/compact-lot-delete-button.png
            adb shell wm size reset
            adb shell wm density reset
            adb shell settings put system font_scale 1.0
      - name: Capture emulator details on failure
        if: failure()
        run: timeout 20s adb logcat -d -s AndroidRuntime > native-android/account-crash.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-foundation-test-results
          path: |
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
            native-android/app/build/outputs/connected_android_test_additional_output/
            native-android/ui-*.png
            native-android/compact-*.png
            native-android/compact-ui-test.txt
            native-android/account-crash.log
            native-android/native-account-draft.png
            native-android/native-market-order.png
            native-android/native-logistics.png
          retention-days: 7
