name: Build Native Android APK
on:
  push:
    branches: [main, cloudflare-demo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-native-demo-signing-v1
      - run: npm ci && npm test
      - name: Compile native application and device tests
        working-directory: native-android
        shell: bash
        run: |
          set +e
          bash ./gradlew assembleRelease assembleDebug assembleDebugAndroidTest --no-daemon 2>&1 | tee build.log
          result=${PIPESTATUS[0]}
          if [ "$result" != 0 ]; then
            grep -A 8 -E 'error:|What went wrong|Execution failed' build.log | head -80 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$result"
      - name: Verify native APK signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          sdktools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          apk=native-android/app/build/outputs/apk/release/app-release.apk
          mkdir -p apk-download
          "$sdktools/apksigner" verify --verbose --print-certs "$apk" > apk-download/verification.txt
          "$sdktools/aapt" dump badging "$apk" >> apk-download/verification.txt
          grep "package: name='com.ewaste.marketplace.nativeapp' versionCode='2' versionName='2.0-native'" apk-download/verification.txt
          if grep -E 'application-testOnly|application-debuggable' apk-download/verification.txt; then exit 1; fi
          if grep -R -E 'import android.webkit|com.getcapacitor' native-android/app/src/main; then exit 1; fi
          cp "$apk" apk-download/E-Waste-Marketplace-native-v2.apk
          sha256sum apk-download/*.apk >> apk-download/verification.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 installation and native photo flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell settings put system screen_off_timeout 1800000
            adb shell svc power stayon true
            adb install native-android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.ewaste.marketplace.nativeapp/com.ewaste.nativeapp.MainActivity
            adb shell pidof com.ewaste.marketplace.nativeapp
            adb exec-out screencap -p > apk-download/native-home.png
            cd native-android && bash ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Report device test failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('native-android/app/build/outputs/androidTest-results/**/*.xml',recursive=True):
              try:
                  for case in ET.parse(path).iter('testcase'):
                      for failure in list(case.findall('failure'))+list(case.findall('error')):
                          message=(case.get('name','')+' '+(failure.text or failure.get('message','')))[:3500]
                          print('::error::'+message.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
              except ET.ParseError:
                  pass
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: E-Waste-Marketplace-native-v2
          path: apk-download/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-diagnostics
          path: |
            native-android/build.log
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
