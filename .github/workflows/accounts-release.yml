name: Publish native accounts demo APK
on:
  push:
    branches: [codex/erp-release]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_ORIGIN: https://ewaste-accounts-demo.ewaste-marketplace.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: npm ci && npm test && npm run check && npm run build
      - name: Load the permanent signing identity
        env:
          ANDROID_SIGNING_JSON: ${{ secrets.ANDROID_SIGNING_JSON }}
        run: python3 scripts/prepare-android-signing.py
      - name: Download the actual previously distributed v3 APK
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: orcazen9-png/application-ewaste
          run-id: 35908615465
          name: E-Waste-Marketplace-native-v3
          path: previous-release
      - name: Build the signed native release and test APK
        working-directory: native-android
        run: |
          set -euo pipefail
          bash ./gradlew assembleRelease -PaccountFoundation=true -PinvitationSignIn=true -PaccountApiOrigin="$API_ORIGIN" -PappVersionCode=4 -PappVersionName=3.0-accounts-demo --no-daemon
          bash ./gradlew assembleDebug assembleDebugAndroidTest -PaccountFoundation=true -PinvitationSignIn=false -PaccountApiOrigin="$API_ORIGIN" -PappVersionCode=4 --no-daemon
      - name: Verify release certificate, package and native implementation
        run: |
          set -euo pipefail
          sdktools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p apk-download upgrade-baseline
          apk=native-android/app/build/outputs/apk/release/app-release.apk
          cp previous-release/E-Waste-Marketplace-native-v3.apk upgrade-baseline/app.apk
          cp native-android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk upgrade-baseline/tests.apk
          "$sdktools/apksigner" verify --verbose --print-certs "$apk" > apk-download/verification.txt
          "$sdktools/aapt" dump badging "$apk" >> apk-download/verification.txt
          "$sdktools/apksigner" verify --print-certs upgrade-baseline/app.apk > upgrade-baseline/certificate.txt
          grep "package: name='com.ewaste.marketplace.collector' versionCode='4' versionName='3.0-accounts-demo'" apk-download/verification.txt
          python3 - <<'PY'
          import pathlib,re
          expected=pathlib.Path('native-android/signing-certificate.sha256').read_text().strip().lower()
          for file in ['apk-download/verification.txt','upgrade-baseline/certificate.txt']:
              hashes=re.findall(r'certificate SHA-256 digest:\s*([a-f0-9]{64})',pathlib.Path(file).read_text(),re.I)
              assert hashes and all(h.lower()==expected for h in hashes), 'Signing certificate changed'
          PY
          if grep -E 'application-testOnly|application-debuggable' apk-download/verification.txt; then exit 1; fi
          if grep -R -E 'import android.webkit|com.getcapacitor' native-android/app/src/main; then exit 1; fi
          cp "$apk" apk-download/E-Waste-Marketplace-native-v4.apk
          sha256sum apk-download/*.apk >> apk-download/verification.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual v3 to v4 installation, data preservation and native role tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            bash scripts/test-android-upgrade.sh
            adb shell am start -W -n com.ewaste.marketplace.collector/com.ewaste.nativeapp.MainActivity
            adb shell uiautomator dump /sdcard/release-signin.xml
            adb pull /sdcard/release-signin.xml apk-download/release-signin.xml
            grep -q 'Invitation code' apk-download/release-signin.xml
            adb exec-out screencap -p > apk-download/native-signin.png
            cd native-android && bash ./gradlew connectedDebugAndroidTest -PaccountFoundation=true -PinvitationSignIn=false -PaccountApiOrigin="$API_ORIGIN" -PappVersionCode=4 -Pandroid.testInstrumentationRunnerArguments.class=com.ewaste.nativeapp.AccountFoundationTest,com.ewaste.nativeapp.MarketplaceTest,com.ewaste.nativeapp.LogisticsTest,com.ewaste.nativeapp.FinanceTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: E-Waste-Marketplace-native-v4
          path: apk-download/
          if-no-files-found: error
      - name: Publish a direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create native-v4-demo apk-download/E-Waste-Marketplace-native-v4.apk apk-download/verification.txt apk-download/native-signin.png --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "E-Waste Marketplace — native accounts demo v4" --notes-file docs/native-v4-release.md --prerelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-v4-diagnostics
          path: |
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
            upgrade-baseline/*.txt
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          if [ -n "${EWASTE_SIGNING_STORE:-}" ]; then rm -f -- "$EWASTE_SIGNING_STORE"; fi
