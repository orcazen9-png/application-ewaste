plugins { id 'com.android.application' }
android {
    namespace 'com.ewaste.nativeapp'
    compileSdk 36
    defaultConfig {
        // New identity preserves old installs whose signing keys were lost in CI.
        applicationId 'com.ewaste.marketplace.collector'
        minSdk 26
        targetSdk 36
        versionCode = (project.findProperty('appVersionCode') ?: '3').toInteger()
        versionName = project.findProperty('appVersionName') ?: '2.1-native'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    defaultConfig {
        // Enabled only for the account-foundation build until its backend is configured.
        buildConfigField 'boolean', 'ACCOUNT_FOUNDATION', (project.findProperty('accountFoundation') ?: 'false').toString()
        def accountOrigin = (project.findProperty('accountApiOrigin') ?: 'https://ewaste-demo.ewaste-marketplace.workers.dev').toString()
        if (!(accountOrigin ==~ /https:\/\/[A-Za-z0-9.-]+(:[0-9]+)?/)) throw new GradleException('accountApiOrigin must be an HTTPS origin')
        buildConfigField 'String', 'ACCOUNT_API_ORIGIN', '"' + accountOrigin + '"'
    }
    signingConfigs {
        collector {
            if (System.getenv('EWASTE_SIGNING_STORE')) {
                storeFile file(System.getenv('EWASTE_SIGNING_STORE'))
                storeType 'PKCS12'
                storePassword System.getenv('EWASTE_SIGNING_PASSWORD')
                keyAlias System.getenv('EWASTE_SIGNING_ALIAS')
                keyPassword System.getenv('EWASTE_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.collector
            debuggable false
            minifyEnabled false
        }
    }
    buildTypes.debug { if (System.getenv('EWASTE_SIGNING_STORE')) signingConfig signingConfigs.collector }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.contains('Release') } && !System.getenv('EWASTE_SIGNING_STORE')) {
        throw new GradleException('Release signing key is required. Refusing to generate an incompatible replacement key.')
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.core:core:1.17.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

